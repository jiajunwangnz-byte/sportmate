services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sportmate
      POSTGRES_PASSWORD: sportmate
      POSTGRES_DB: sportmate
    ports:
      - "5433:5432"
    volumes:
      - sportmate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportmate -d sportmate"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sportmate_pg:
